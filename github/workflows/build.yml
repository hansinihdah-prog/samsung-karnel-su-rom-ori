name: Build Kernel A05 (6.6.89)

# Taruh file ini di: .github/workflows/build.yml  (repo baru boleh kosong)
# Opsional: folder patches/ berisi file .patch (SUSFS, hook manual KernelSU, ZeroMount)
# Opsional: file config.fragment berisi baris CONFIG_xxx=y tambahan

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Commit source rsuntk (default = 6.6.89 sesuai ROM ori)"
        default: "f599cd4b93a4fe1bacb8d29e4b978b56f4a0fee0"
      expected_sublevel:
        description: "SUBLEVEL yang harus cocok (build dihentikan kalau beda)"
        default: "89"
      defconfig:
        description: "Defconfig"
        default: "gki_defconfig"
      ksu_setup_url:
        description: "URL setup.sh root manager (kosongkan kalau tidak pakai)"
        default: "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
      ksu_branch:
        description: "Branch root manager"
        default: "main"
      disable_io_uring:
        description: "Matikan io_uring (seperti build kamu yang berhasil)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo build (patches, config.fragment)
        uses: actions/checkout@v4

      - name: Bersihkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves cpio lz4 zip unzip \
            python3 curl git gcc-aarch64-linux-gnu clang-18 lld-18 llvm-18

      - name: Ambil source kernel (satu commit saja)
        run: |
          mkdir kernel && cd kernel
          git init -q
          git remote add origin https://github.com/rsuntk/android_kernel_samsung_a05m-6.6
          git fetch --depth=1 origin "${{ inputs.source_commit }}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Cek versi kernel
        working-directory: kernel
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile | head -3
          SUB=$(grep -m1 '^SUBLEVEL' Makefile | awk '{print $3}')
          if [ "$SUB" != "${{ inputs.expected_sublevel }}" ]; then
            echo "SUBLEVEL $SUB tidak sama dengan ${{ inputs.expected_sublevel }}"; exit 1
          fi

      - name: Pasang root manager (KernelSU)
        if: ${{ inputs.ksu_setup_url != '' }}
        working-directory: kernel
        run: |
          curl -LSs "${{ inputs.ksu_setup_url }}" | bash -s "${{ inputs.ksu_branch }}"

      - name: Terapkan patch dari folder patches/
        working-directory: kernel
        run: |
          shopt -s nullglob
          for p in ../patches/*.patch; do
            echo ">> $p"
            patch -p1 --no-backup-if-mismatch < "$p" || { echo "GAGAL: $p"; exit 1; }
          done

      - name: Konfigurasi kernel
        working-directory: kernel
        run: |
          export MAKEFLAGS="O=out ARCH=arm64 LLVM=-18 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-"
          make $MAKEFLAGS ${{ inputs.defconfig }}
          # config tambahan KernelSU + SUSFS (diabaikan otomatis kalau patch tidak ada)
          for c in KSU KPM KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_OPEN_REDIRECT \
                   KSU_SUSFS_SUS_MAP; do
            scripts/config --file out/.config --enable $c
          done
          if [ "${{ inputs.disable_io_uring }}" = "true" ]; then
            scripts/config --file out/.config --disable IO_URING
          fi
          if [ -f ../config.fragment ]; then
            cat ../config.fragment >> out/.config
          fi
          make $MAKEFLAGS olddefconfig
          grep -E 'CONFIG_KSU|CONFIG_IO_URING' out/.config || true

      - name: Build
        working-directory: kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=-18 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tail -n 40
          ls -lh out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m1 'Linux version'

      - name: Kemas zip (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          cat > ak3/anykernel.sh <<'EOF'
          ### AnyKernel3 - Samsung A05 6.6.89
          properties() { '
          kernel.string=A05 6.6.89 KernelSU + SUSFS
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          sed -i 's/^          //' ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          mkdir -p dist
          (cd ak3 && zip -r9 ../dist/A05-6.6.${{ inputs.expected_sublevel }}-KSU-SUSFS.zip . -x '*.git*')
          cp kernel/out/arch/arm64/boot/Image dist/Image
          cp kernel/out/.config dist/config.txt

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a05-6.6.${{ inputs.expected_sublevel }}
          path: dist/*
